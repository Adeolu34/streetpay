workflows:
  ios-release:
    name: iOS Release to App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: streetpay
    integrations:
      app_store_connect: streetpay
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.streetpayngr.app
      flutter: 3.41.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: Synchronize system clock with Apple NTP
        script: |
          sudo sntp -sS time.apple.com || sudo sntp -sS pool.ntp.org || true
          date
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Generate App Store Screenshots
        script: |
          pip3 install pillow || true
          python3 ../scripts/generate_screenshots.py || true
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - streetpay/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ../screenshots/**/*.png
      - screenshots/**/*.png

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  generate-screenshots:
    name: Generate Real iOS Simulator Screenshots
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: streetpay
    environment:
      flutter: 3.41.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages & CocoaPods
        script: |
          flutter pub get
          cd ios && pod install && cd ..
      - name: Install Python Pillow
        script: pip3 install pillow
      - name: Capture Real iOS Simulator Screenshots
        script: |
          capture_sim() {
            local LABEL="$1"
            shift
            local UDID=""
            for NAME in "$@"; do
              UDID=$(xcrun simctl list devices available | grep -F "$NAME (" | grep -oE '[0-9A-F-]{36}' | head -n 1 || true)
              if [ -n "$UDID" ]; then
                echo "Found simulator '$NAME' ($UDID) for $LABEL"
                break
              fi
            done
            if [ -z "$UDID" ]; then
              echo "No matching simulator found for $LABEL"
              return 0
            fi

            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override \
              --time "9:41" \
              --dataNetwork wifi \
              --wifiMode active \
              --wifiBars 3 \
              --cellularMode active \
              --cellularBars 4 \
              --batteryState charged \
              --batteryLevel 100 || true

            SCREENSHOT_DIR="../screenshots/$LABEL" flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/screenshots_test.dart \
              -d "$UDID" \
              --no-pub || true

            xcrun simctl shutdown "$UDID" || true
          }

          xcrun simctl list devices available
          capture_sim "sim_6.9" "iPhone 16 Pro Max" "iPhone 17 Pro Max" "iPhone 15 Pro Max"
          capture_sim "sim_6.3" "iPhone 16 Pro" "iPhone 17 Pro" "iPhone 16" "iPhone 15 Pro"
          capture_sim "sim_ipad" "iPad Pro 13-inch (M4)" "iPad Pro 13-inch" "iPad Pro (12.9-inch)" "iPad Air 13-inch"
      - name: Normalize to all App Store Connect display sizes
        script: python3 ../scripts/normalize_sim_screenshots.py
    artifacts:
      - ../screenshots/**/*.png
      - screenshots/**/*.png
