workflows:
  ios-release:
    name: iOS Release to App Store
    instance_type: mac_mini_m1
    max_build_duration: 60
    working_directory: streetpay
    integrations:
      app_store_connect: streetpay
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up keychain to be able to sign
        script: keychain initialize
      - name: Fetch signing files from Apple Developer
        script: |
          app-store-connect fetch-signing-files "com.streetpayngr.smartapp" \
            --type IOS_APP_STORE \
            --create
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - streetpay/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
